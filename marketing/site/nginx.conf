map $host $site_robots {
    default "noindex, nofollow";
    say.anikuku.com "";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Robots-Tag $site_robots always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /ver.json {
        add_header X-Robots-Tag $site_robots always;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location = /revision.txt {
        add_header X-Robots-Tag $site_robots always;
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
