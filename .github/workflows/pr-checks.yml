name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source and history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check patch whitespace
        run: git diff --check origin/main...HEAD

      - name: Verify Xcode
        run: xcodebuild -version

      - name: Run tests
        run: swift test

      - name: Package debug app
        env:
          SAYKUKU_CI_ADHOC_SIGNING: "1"
        run: Scripts/package-app.sh debug
