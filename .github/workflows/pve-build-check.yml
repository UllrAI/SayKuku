name: PVE website build check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'UllrAI/SayKuku' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, pve-101, pve-101-ullrai]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and smoke test the website image
        run: bash Scripts/check_pve_runner.sh
